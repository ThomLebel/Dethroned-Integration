<!-- ═══════════════════════════════════════
     SCRIPTS — Ordre critique
     1. Données partagées
     2. Assets HTML/CSS des outils (lourd — chargé en dernier)
     3. Pages modules
     4. Routeur SPA
     ═══════════════════════════════════════ -->

<!-- 1. Données -->

<!-- 2. Pages légères -->

<!-- 5. Logiques originales des outils (chargées à la demande par init()) -->
<!-- arena-forge-logic.js et mockups-logic.js sont chargés dynamiquement -->

<!-- 6. Routeur SPA -->
<script>
const SPA = {
  PAGES: {
    'home':        { module: null, key: 'PAGE_HOME',        footer: true,  fullscreen: false },
    'moodboard':   { module: null, key: 'PAGE_MOODBOARD',   footer: true,  fullscreen: false },
    'playlist':    { module: null, key: 'PAGE_PLAYLIST',    footer: true,  fullscreen: false },
    'mockups':     { module: null, key: 'PAGE_MOCKUPS',     footer: false, fullscreen: true  },
    'build-sim':   { module: null, key: 'PAGE_BUILD_SIM',   footer: false, fullscreen: true  },
    'arena-forge': { module: null, key: 'PAGE_ARENA_FORGE', footer: false, fullscreen: true  },
  },
  current: null,

  go(page) {
    if (!this.PAGES[page]) page = 'home';
    const cfg = this.PAGES[page];

    // Résoudre le module (lazy — les scripts sont déjà chargés)
    if (!cfg.module) cfg.module = window[cfg.key];
    if (!cfg.module) { console.error('Module not found:', cfg.key); return; }

    // Arrêter le timer carrousel si on quitte home
    if (this.current === 'home' && window.PAGE_HOME && window.PAGE_HOME._carouselTimer) {
      clearInterval(window.PAGE_HOME._carouselTimer);
      window.PAGE_HOME._carouselTimer = null;
    }

    history.replaceState(null, '', '#' + page);

    const root = document.getElementById('page-root');
    root.innerHTML = cfg.module.render();
    root.classList.remove('page-enter');
    void root.offsetWidth; // reflow
    root.classList.add('page-enter');

    if (typeof cfg.module.init === 'function') {
      requestAnimationFrame(() => cfg.module.init());
    }

    const footer = document.getElementById('site-footer');
    if (footer) footer.style.display = cfg.footer ? '' : 'none';

    document.querySelectorAll('[data-page]').forEach(el => {
      el.classList.toggle('active', el.dataset.page === page);
    });

    this.current = page;
    if (!cfg.fullscreen) window.scrollTo(0, 0);
  },

  init() {
    const hash = window.location.hash.replace('#', '') || 'home';
    this.go(hash);
    window.addEventListener('hashchange', () => {
      const p = window.location.hash.replace('#', '') || 'home';
      if (p !== this.current) this.go(p);
    });
  }
};

document.addEventListener('DOMContentLoaded', () => SPA.init());
</script>
