<!-- 3. Routeur SPA -->
<script>
const SPA = {
  // Mapping route → module
  PAGES: {
    'home':        { module: PAGE_HOME,        footer: true,  fullscreen: false },
    'moodboard':   { module: PAGE_MOODBOARD,   footer: true,  fullscreen: false },
    'playlist':    { module: PAGE_PLAYLIST,    footer: true,  fullscreen: false },
    'mockups':     { module: PAGE_MOCKUPS,     footer: false, fullscreen: true  },
    'build-sim':   { module: PAGE_BUILD_SIM,   footer: false, fullscreen: true  },
    'arena-forge': { module: PAGE_ARENA_FORGE, footer: false, fullscreen: true  },
  },

  current: null,

  go(page) {
    if (!this.PAGES[page]) page = 'home';
    const cfg = this.PAGES[page];

    // Mettre à jour le hash sans déclencher hashchange
    history.replaceState(null, '', '#' + page);

    // Injecter le HTML
    const root = document.getElementById('page-root');
    root.innerHTML = cfg.module.render();

    // Init du module si nécessaire
    if (typeof cfg.module.init === 'function') {
      // Attendre que le DOM soit dispo
      requestAnimationFrame(() => cfg.module.init());
    }

    // Footer & main-content height
    const footer = document.getElementById('site-footer');
    if (footer) footer.style.display = cfg.footer ? '' : 'none';

    // Nav active state
    document.querySelectorAll('[data-page]').forEach(el => {
      el.classList.toggle('active', el.dataset.page === page);
    });

    this.current = page;
    window.scrollTo(0, 0);
  },

  init() {
    // Lire le hash initial
    const hash = window.location.hash.replace('#', '') || 'home';
    this.go(hash);

    // Écouter les changements de hash (bouton retour)
    window.addEventListener('hashchange', () => {
      const page = window.location.hash.replace('#', '') || 'home';
      if (page !== this.current) this.go(page);
    });
  }
};

// Démarrage
document.addEventListener('DOMContentLoaded', () => SPA.init());
</script>
